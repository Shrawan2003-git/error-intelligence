name: error-intelligence-demo

services:
  postgres:
    build:
      context: ../postgres
    environment:
      POSTGRES_DB: error_intelligence
      POSTGRES_USER: error_intelligence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in public-demo.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 768m

  redis:
    build:
      context: ../redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in public-demo.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in public-demo.env}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    mem_limit: 192m

  backend:
    build:
      context: ../../back-end
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/error_intelligence
      DB_USERNAME: error_intelligence
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in public-demo.env}
      DB_POOL_SIZE: 5
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in public-demo.env}
      AUTH_SIGNING_KEY: ${AUTH_SIGNING_KEY:?Set AUTH_SIGNING_KEY in public-demo.env}
      PUBLIC_APP_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in public-demo.env}
      FORWARDED_HEADERS_STRATEGY: NATIVE
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in public-demo.env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in public-demo.env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in public-demo.env}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in public-demo.env}
      AI_WORKER_ENABLED: "false"
      AI_EMBEDDING_WORKER_ENABLED: "false"
      RAW_EVENT_RETENTION_DAYS: 30
      SCHEDULER_POOL_SIZE: 2
      SERVER_PORT: 8080
      APP_VERSION: ${APP_VERSION:-0.1.0-cv-demo}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: 1024m

  frontend:
    build:
      context: ../../front-end
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: 192m

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in public-demo.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    mem_limit: 192m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
